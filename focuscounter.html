<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: rgb(245, 226, 220);
            display: flex;
            align-items: center;
            flex-direction: column;
            border-radius: 15px;
            height: auto;
            width: 400px;
            gap: 5px;
            padding: 0px 20px;
            box-shadow: 2px 8px 10px rgba(0, 0, 0, 0.118);
        }

        h1 {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .sub {
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            text-wrap: wrap;
            text-align: center;
        }

        .btn {
            padding: 15px 20px;
            border-radius: 14px;
            color: #222;
            font-size: 20px;
            font-family: Arial, Helvetica, sans-serif;
            border: none;
        }

        .in {
            background-color: #16a34a;
        }

        .de {
            background-color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1 class="title">Focus Counter</h1>
        <p class="sub">Welcome to Focus Counter App, A place where you can track you focus progress.</p>
        <button type="button" class="in btn">Increase +1</button>
        <button type="button" class="de btn">Decrease -1</button>
        <button class="re btn">Reset</button>
        <h1 class="count">Focus Count <strong class="co">0</strong></h1>
    </div>
    <script>
        let count = 0;
        let result = document.querySelector(".co")
        let plus = document.querySelector(".in")
        let minus = document.querySelector(".de")
        let reset = document.querySelector(".re")

        plus.addEventListener("click", () => {
            count += 1;
            result.innerHTML = count;
                        updateColor()
        })

        minus.addEventListener("click", () => {
            count -= 1;
            result.innerHTML = count;
                        updateColor()

        }) 
        reset.addEventListener("click", () => {
            count = 0;
            result.innerHTML = count;
            updateColor()
        })   
  function updateColor() {
    let counterText = document.querySelector(".count");

    if (count >= 10) {
        counterText.style.color = "#16a34a";
    } 
    else if (count < 0) {
        counterText.style.color = "#dc2626";
    } 
    else {
        counterText.style.color = "#222";
    }
}
    </script>
</body>

</html>
